
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-classifier-deployment
  labels:
    app: email-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email-classifier
  template:
    metadata:
      labels:
        app: email-classifier
    spec:
      containers:
      - name: predictor
        image: docker.io/library/email-classifier:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: MODEL_PATH
          value: "data/model.joblib"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: email-classifier-service
spec:
  type: ClusterIP
  selector:
    app: email-classifier
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
